name: CI

on:
  push:
  pull_request:

jobs:
  python-ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and API tests (offline, no API keys)
        run: |
          pytest -q | tee pytest.out
          echo "::notice title=python tests::$(tail -1 pytest.out)"
      - name: RAG evaluation on the golden set
        run: python -m eval.run_eval

  java-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (JUnit, stub AI service)
        run: mvn -B -ntp verify
      - name: Report test counts
        if: always()
        run: |
          t=$(grep -ho '<testsuite[^>]* tests="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          f=$(grep -ho '<testsuite[^>]* failures="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          echo "::notice title=java-gateway tests::$t tests run, $f failures"

  java-spring-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java-spring-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (JUnit, offline models)
        run: mvn -B -ntp verify
      - name: Report test counts
        if: always()
        run: |
          t=$(grep -ho '<testsuite[^>]* tests="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          f=$(grep -ho '<testsuite[^>]* failures="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
          echo "::notice title=java-spring-ai tests::$t tests run, $f failures"
      - name: Provider profiles resolve and compile (OpenAI, Azure OpenAI, Anthropic)
        run: |
          mvn -B -ntp -q -Popenai -DskipTests package
          mvn -B -ntp -q -Pazure -DskipTests package
          mvn -B -ntp -q -Panthropic -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
